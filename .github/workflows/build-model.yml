name: Build submission model

on:
  push:
    branches: [submit/glm-cycle-190]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: \!contains(github.event.head_commit.message, '[model-built]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: ">=0.12"
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Build model.pt
        run: |
          uv run python - <<'PY'
          import json
          import torch
          from torch import nn

          w = json.load(open("models/snake-simple-16x16/glm-cycle-190/weights.json"))
          sizes = [6, 12, 6, 4]
          layers = []
          for i in range(3):
              layers.append(nn.Linear(sizes[i], sizes[i + 1]))
              if i < 2:
                  layers.append(nn.ReLU())
          model = nn.Sequential(*layers)
          sd = {
              "0.weight": torch.tensor([[float(v) for v in r] for r in w["w1"]], dtype=torch.float32),
              "0.bias": torch.tensor([float(v) for v in w["b1"]], dtype=torch.float32),
              "2.weight": torch.tensor([[float(v) for v in r] for r in w["w2"]], dtype=torch.float32),
              "2.bias": torch.tensor([float(v) for v in w["b2"]], dtype=torch.float32),
              "4.weight": torch.tensor([[float(v) for v in r] for r in w["w3"]], dtype=torch.float32),
              "4.bias": torch.tensor([float(v) for v in w["b3"]], dtype=torch.float32),
          }
          model.load_state_dict(sd)
          torch.save(model.state_dict(), "models/snake-simple-16x16/glm-cycle-190/model.pt")
          PY
      - name: Evaluate
        run: |
          uv run mnnc evaluate snake-simple-16x16 models/snake-simple-16x16/glm-cycle-190 | tee /tmp/evaluate.log
      - name: Commit and push model
        run: |
          git config user.name "glm-cycle-190 build bot"
          git config user.email "actions@users.noreply.github.com"
          git add models/snake-simple-16x16/glm-cycle-190/model.pt
          git commit -m "Add model.pt for glm-cycle-190 [model-built]" -m "$(cat /tmp/evaluate.log)"
          git push
