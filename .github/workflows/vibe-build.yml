name: Vibe submission builder

on:
  push:
    branches: [vibe-builder]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/submit/glm-cycle-distilled
          fetch-depth: 0
      - name: Check out builder scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/vibe-builder
          path: builder
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: ">=0.12"
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Build submission
        run: uv run --no-sync python builder/vibe/build.py
      - name: Official evaluation
        run: uv run --no-sync mnnc evaluate snake-simple-16x16 models/snake-simple-16x16/glm-cycle-distilled
      - name: Validate submission gate
        run: uv run --no-sync mnnc validate-submission models/snake-simple-16x16/glm-cycle-distilled
      - name: Commit submission
        run: |
          git config user.name "GLM x le vibe"
          git config user.email "wd7512@users.noreply.github.com"
          git add models/snake-simple-16x16/glm-cycle-distilled
          git commit -m "Add snake-simple-16x16/glm-cycle-distilled"
          git push origin HEAD:submit/glm-cycle-distilled
