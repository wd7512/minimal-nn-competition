name: Vibe submission builder

on:
  push:
    branches: [vibe-builder]
    paths-ignore: ["vibe/last-run.log"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VIBE_SMOKE: "1" # set to "0" for the real run
  VIBE_NAME: glm-cycle-smoke # real run: glm-cycle-distilled
  VIBE_TARGET: submit/glm-cycle-smoke # real run: submit/glm-cycle-distilled
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out submission branch (workspace)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/submission
          fetch-depth: 0
      - name: Check out builder scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/vibe-builder
          path: builder
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: ">=0.12"
      - name: Run Vibe CI script
        run: bash builder/vibe/ci.sh
