name: LunarLander large policy experiment
on:
  pull_request:
    branches: [dev]
    paths:
      - 'experiments/lunarlander_large_search.py'
      - '.github/workflows/lunarlander-large.yml'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          version: ">=0.12"
      - run: uv sync --dev --frozen
      - run: uv run --no-sync python experiments/lunarlander_large_search.py --trials 240
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lunarlander-large-checkpoint-and-report
          path: /tmp/lunarlander-large-search
