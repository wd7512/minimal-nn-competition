name: CI

on:
  # Run once per pull request; push checks duplicate them.
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            exit 0
          fi
          if [ "$HEAD_REF" != "dev" ] && [ "$HEAD_REF" != "submission" ]; then
            echo "::error::PRs into main must come from dev or submission (head: $HEAD_REF)"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: ">=0.12"
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --no-sync ruff format --check
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Type check
        run: uv run --no-sync ty check
      - name: Test
        run: uv run --no-sync pytest
      - name: Check leaderboard site
        run: |
          uv run --no-sync mnnc render docs/leaderboard.json /tmp/minimal-nn-docs --replays docs/games
          uv run --no-sync mnnc render-speed docs/internal/speed/leaderboard.json /tmp/minimal-nn-docs/internal
          uv run --no-sync mnnc render-internal docs/internal/leaderboard.json /tmp/minimal-nn-docs
          if diff -ru --brief docs /tmp/minimal-nn-docs; then
            exit 0
          fi
          {
            echo "## Leaderboard site differences"
            echo
            echo '```diff'
            diff -ruU3 docs /tmp/minimal-nn-docs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Build
        run: uv build
