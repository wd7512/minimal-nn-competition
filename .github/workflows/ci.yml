name: CI

on:
  # Run once per pull request; push checks duplicate them.
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
          version: "0.12.13"
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --no-sync ruff format --check
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Type check
        run: uv run --no-sync ty check
      - name: Test
        run: uv run --no-sync pytest
      - name: Check leaderboard site
        run: |
          uv run --no-sync mnnc render leaderboard.json /tmp/minimal-nn-docs --replays docs/games
          uv run --no-sync mnnc render-speed speed-leaderboard.json /tmp/minimal-nn-docs/internal
          uv run --no-sync mnnc render-internal internal-leaderboard.json /tmp/minimal-nn-docs
          diff -ru docs /tmp/minimal-nn-docs
      - name: Build
        run: uv build
