name: Breakability proof experiment
on:
  pull_request:
    branches: [dev]
    paths:
      - 'experiments/breakability_proof.py'
      - '.github/workflows/breakability-proof.yml'
permissions:
  contents: read
jobs:
  cartpole:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          version: ">=0.12"
      - run: uv sync --dev --frozen
      - run: uv run --no-sync python experiments/breakability_proof.py --task cartpole --output /tmp/breakability-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proof-cartpole
          path: /tmp/breakability-proof
  other-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        task: [pendulum, lunarlander, snake]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          version: ">=0.12"
      - run: uv sync --dev --frozen
      - run: uv run --no-sync python experiments/breakability_proof.py --task ${{ matrix.task }} --output /tmp/breakability-proof
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proof-${{ matrix.task }}
          path: /tmp/breakability-proof
