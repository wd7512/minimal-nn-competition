[project]
name = "minimal-nn-competition"
version = "0.0.2"
description = "A platform for presenting and finding the smallest possible neural-network for problems."
readme = "README.md"
authors = [
    { name = "William Dennis", email = "wwdennis.home@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = ["pydantic==2.14.1", "torch==2.14.1"]

[project.scripts]
minimal-nn-competition = "minimal_nn_competition.__main__:main"
minimal_nn_competition = "minimal_nn_competition.__main__:main"
mnnc = "minimal_nn_competition.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.1",
    "ty==0.0.90",
]

[tool.uv]
required-version = "0.12.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["minimal_nn_competition"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n 2"

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"
