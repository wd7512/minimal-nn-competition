<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snake Obstacles 8x8 replay — example</title><style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { margin: 0 auto; max-width: 72rem; padding: 2rem; line-height: 1.5; }
table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
th, td { border-bottom: 1px solid #8884; padding: 0.5rem; text-align: left; }
th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
tr.passed td { font-weight: 600; }
.muted { opacity: 0.65; }
footer { margin-top: 2rem; text-align: right; }
.version { color: inherit; opacity: 0.35; text-decoration: none; font-size: 0.8rem; }
.version:hover, .version:focus-visible { opacity: 1; }

canvas { border: 1px solid #8884; image-rendering: pixelated; width: min(80vw, 480px);
  height: auto; }
.controls { display: flex; gap: 0.5rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
button, select { font: inherit; padding: 0.25rem 0.75rem; }
</style></head><body><header><h1>Snake Obstacles 8x8 replay — example</h1><p>Seed 0, 11 moves, final length 1.</p><p><a href="../">Main leaderboard</a></p></header><canvas id="board" width="320" height="320"></canvas><div class="controls"><button id="play" type="button">Play</button><button id="prev" type="button">Step back</button><button id="next" type="button">Step forward</button><label>Speed <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="4" selected>4x</option><option value="8">8x</option></select></label></div><p id="status" class="muted"></p><script>
const FRAMES = [{"food": [3, 7], "snake": [[4, 4]]}, {"food": [3, 7], "snake": [[5, 4]]}, {"food": [3, 7], "snake": [[6, 4]]}, {"food": [3, 7], "snake": [[7, 4]]}, {"food": [3, 7], "snake": [[7, 3]]}, {"food": [3, 7], "snake": [[7, 2]]}, {"food": [3, 7], "snake": [[6, 2]]}, {"food": [3, 7], "snake": [[5, 2]]}, {"food": [3, 7], "snake": [[4, 2]]}, {"food": [3, 7], "snake": [[3, 2]]}, {"food": [3, 7], "snake": [[2, 2]]}, {"food": [3, 7], "snake": [[2, 2]]}];
const SIZE = 8;
const BLOCKED = [[1, 2], [2, 0], [2, 6], [5, 6]];
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const playButton = document.getElementById("play");
const speed = document.getElementById("speed");
let frame = 0;
let playing = false;
let timer = null;
function draw() {
  const cell = canvas.width / SIZE;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  BLOCKED.forEach((blockedCell) => {
    ctx.fillStyle = "#555";
    ctx.fillRect(blockedCell[0] * cell, blockedCell[1] * cell, cell, cell);
  });
  const food = FRAMES[frame].food;
  if (food) {
    ctx.fillStyle = "#c33";
    ctx.fillRect(food[0] * cell, food[1] * cell, cell, cell);
  }
  const snake = FRAMES[frame].snake;
  snake.forEach((segment, index) => {
    ctx.fillStyle = index === 0 ? "#1a7f37" : "#3fb950";
    ctx.fillRect(segment[0] * cell, segment[1] * cell, cell, cell);
  });
  status.textContent = "move " + frame + "/" + (FRAMES.length - 1)
    + ", length " + snake.length;
}
function step(delta) {
  frame = Math.min(FRAMES.length - 1, Math.max(0, frame + delta));
  draw();
}
function stop() {
  playing = false;
  playButton.textContent = "Play";
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }
}
function play() {
  if (playing) {
    stop();
    return;
  }
  if (frame >= FRAMES.length - 1) {
    frame = 0;
  }
  playing = true;
  playButton.textContent = "Pause";
  timer = setInterval(() => {
    frame += 1;
    if (frame >= FRAMES.length - 1) {
      frame = FRAMES.length - 1;
      stop();
    }
    draw();
  }, Math.max(16, Math.floor(240 / Number(speed.value))));
}
playButton.addEventListener("click", play);
document.getElementById("prev").addEventListener("click", () => { stop(); step(-1); });
document.getElementById("next").addEventListener("click", () => { stop(); step(1); });
speed.addEventListener("change", () => { if (playing) { stop(); play(); } });
draw();
</script></body></html>
